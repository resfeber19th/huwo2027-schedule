<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合奏計画ポータル</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- 認証モーダル -->
    <div id="auth-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-8 text-center">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full mb-4 text-sm font-bold text-white" style="background-color: #23651C;">
                認証
            </div>
            <h2 class="text-xl font-bold text-slate-900 mb-2">合奏計画閲覧認証</h2>

            <!-- 読み込み中表示（自動ログイン時） -->
            <div id="loading-box" style="display:none;" class="py-6">
                <p class="text-sm text-slate-500">データを読み込み中です…（数秒かかることがあります）</p>
            </div>

            <div id="login-box">
                <p class="text-sm text-slate-500 mb-6">IDとパスワードを入力してください。</p>
                <form onsubmit="handleLogin(event)" class="space-y-4">
                    <input type="text" id="id-input" placeholder="ID" autocomplete="username"
                        class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 text-center text-base" style="--tw-ring-color: #23651C;" required>
                    <input type="password" id="password-input" placeholder="パスワード" autocomplete="current-password"
                        class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 text-center text-base tracking-widest" style="--tw-ring-color: #23651C;" required>
                    <button type="submit" id="login-btn"
                        class="w-full text-white font-medium py-3 rounded-xl transition shadow-sm cursor-pointer hover:opacity-90" style="background-color: #23651C;">
                        ログイン
                    </button>
                </form>
                <p id="error-msg" class="text-xs text-rose-500 mt-3" style="display:none;"></p>
            </div>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <div id="main-content" class="flex-1 flex-col" style="display:none;">
        <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
            <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
                <h1 class="text-lg font-bold" style="color: #23651C;">合奏計画ポータル</h1>
                <button onclick="handleLogout()" class="text-xs text-slate-500 hover:text-slate-800 underline cursor-pointer">ログアウト</button>
            </div>
        </header>

        <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full space-y-6">
            <div class="space-y-3">
                <div>
                    <span class="text-xs font-bold text-slate-400 block mb-1">練習日</span>
                    <div id="date-tabs" class="flex overflow-x-auto space-x-2 pb-2"></div>
                </div>
                <div>
                    <span class="text-xs font-bold text-slate-400 block mb-1">曲名</span>
                    <div id="song-tabs" class="flex overflow-x-auto space-x-2 pb-2"></div>
                </div>
            </div>

            <div id="current-view-title" class="text-lg font-bold text-slate-800 border-b border-slate-200 pb-2"></div>

            <div id="plan-container" class="space-y-4"></div>
        </main>

        <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-400">
            <p>&copy; 2027 スプコン実行委員会</p>
        </footer>
    </div>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyoNd_RolzAmFpGNJCce7Ume5luybFG-6PH6dbKsFD7GYlwk9S8wuVPFsoMhu4i8aZ5/exec";
        const SESSION_KEY = 'auth_passed';
        const FETCH_TIMEOUT_MS = 20000;

        let plans = [];
        let activeMode = 'date';
        let selectedTarget = '';

        /* ---------- ユーティリティ ---------- */

        const store = {
            get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
            set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} },
            remove(k) { try { sessionStorage.removeItem(k); } catch (e) {} }
        };

        function escapeHtml(val) {
            return String(val ?? '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function show(id, display = 'block') { document.getElementById(id).style.display = display; }
        function hide(id) { document.getElementById(id).style.display = 'none'; }

        function showError(msg) {
            const el = document.getElementById('error-msg');
            el.innerText = msg;
            el.style.display = 'block';
        }
        function clearError() { hide('error-msg'); }

        function formatTime(val) {
            if (!val) return "";
            const str = String(val).trim();
            if (str.includes("T")) {
                const parts = str.split("T");
                if (parts.length > 1) {
                    const timePart = parts[1].split(".")[0];
                    const timeSub = timePart.split(":");
                    if (timeSub.length >= 2) return `${timeSub[0]}:${timeSub[1]}`;
                }
            }
            return str;
        }

        // 開始・終了の時刻文字列から「何分間か」を自動計算する
        function formatMinutes(startTimeStr, endTimeStr) {
            if (!startTimeStr || !endTimeStr) return "";
            try {
                const parseTime = (str) => {
                    const cleanStr = String(str).trim();
                    const match = cleanStr.match(/(\d{1,2}):(\d{2})/);
                    if (match) {
                        return parseInt(match[1], 10) * 60 + parseInt(match[2], 10);
                    }
                    return null;
                };

                const startMin = parseTime(startTimeStr);
                const endMin = parseTime(endTimeStr);

                if (startMin !== null && endMin !== null) {
                    let diff = endMin - startMin;
                    if (diff < 0) diff += 24 * 60;
                    return `${diff}`;
                }
            } catch (e) {
                console.error("Minute calculation error:", e);
            }
            return "";
        }

        async function fetchServerData() {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS);
            try {
                const res = await fetch(GAS_API_URL, { signal: ctrl.signal });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                if (!data || !data.auth || !Array.isArray(data.plans)) {
                    throw new Error('INVALID_STRUCTURE');
                }
                return data;
            } finally {
                clearTimeout(timer);
            }
        }

        /* ---------- ログイン / ログアウト ---------- */

        async function handleLogin(event) {
            event.preventDefault();
            const inputId = document.getElementById('id-input').value.trim();
            const inputPass = document.getElementById('password-input').value.trim();
            const btn = document.getElementById('login-btn');
            clearError();
            btn.disabled = true;
            btn.innerText = '確認中…';

            let data;
            try {
                data = await fetchServerData();
            } catch (e) {
                console.error(e);
                showError(e.message === 'INVALID_STRUCTURE'
                    ? 'サーバーからのデータ構造が不正です'
                    : '通信エラーが発生しました（時間をおいて再度お試しください）');
                btn.disabled = false;
                btn.innerText = 'ログイン';
                return;
            }

            btn.disabled = false;
            btn.innerText = 'ログイン';

            if (inputId === String(data.auth.id).trim() && inputPass === String(data.auth.pass).trim()) {
                store.set(SESSION_KEY, 'true');
                enterApp(data);
            } else {
                showError('IDまたはパスワードが正しくありません');
            }
        }

        function handleLogout() {
            store.remove(SESSION_KEY);
            window.location.reload();
        }

        window.addEventListener('DOMContentLoaded', async () => {
            if (store.get(SESSION_KEY) !== 'true') return;

            hide('login-box');
            show('loading-box');
            try {
                const data = await fetchServerData();
                enterApp(data);
            } catch (e) {
                console.error('Auto-login failed:', e);
                store.remove(SESSION_KEY);
                hide('loading-box');
                show('login-box');
                showError('自動ログインに失敗しました。もう一度ログインしてください');
            }
        });

        function enterApp(data) {
            hide('auth-modal');
            show('main-content', 'flex');
            try {
                initApp(data);
            } catch (e) {
                console.error('Render error:', e);
                document.getElementById('plan-container').innerHTML =
                    `<p class="text-sm text-rose-500 text-center py-8">表示中にエラーが発生しました。再読み込みしてください。</p>`;
            }
        }

        /* ---------- 初期化・タブ ---------- */

        function initApp(data) {
            plans = (data.plans || []).filter(p => p && p.date && !String(p.date).includes("ひながた"));

            if (plans.length === 0) {
                document.getElementById('plan-container').innerHTML =
                    `<p class="text-sm text-slate-400 text-center py-8">有効な練習日シートが見つかりません</p>`;
                return;
            }
            selectDateTab(String(plans[0].date));
        }

        function normalizeRow(row) {
            if (!Array.isArray(row)) return null;
            const 開始 = formatTime(row[2]);
            const 終了 = formatTime(row[3]);
            const 曲名 = row[1] ? String(row[1]).trim() : "";
            if (開始 === "" || 終了 === "" || 曲名 === "") return null;
            return {
                枠: row[0] || "",
                曲名,
                開始,
                終了,
                時間: formatMinutes(row[2], row[3]), // 開始・終了から自動計算（修正済）
                一言目標: row[5] || "",
                振り返り: row[6] || "",
                取組箇所: row[7] || "",
                次回向け: row[8] || "",
                備考: row[9] || ""
            };
        }

        function getAllSongs() {
            const songs = new Set();
            plans.forEach(plan => {
                (plan.rows || []).slice(2).forEach(row => {
                    const n = normalizeRow(row);
                    if (n) songs.add(n.曲名);
                });
            });
            return Array.from(songs);
        }

        function makeTabButton(label, isActive, onClick) {
            const btn = document.createElement('button');
            btn.className = 'px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition cursor-pointer';
            if (isActive) {
                btn.className += ' text-white shadow-sm';
                btn.style.backgroundColor = '#23651C';
            } else {
                btn.className += ' bg-white text-slate-600 hover:bg-slate-100 border border-slate-200';
            }
            btn.innerText = label;
            btn.onclick = onClick;
            return btn;
        }

        function renderTabs() {
            const dateContainer = document.getElementById('date-tabs');
            dateContainer.innerHTML = '';
            plans.forEach(item => {
                const d = String(item.date);
                dateContainer.appendChild(
                    makeTabButton(d, activeMode === 'date' && selectedTarget === d, () => selectDateTab(d))
                );
            });

            const songContainer = document.getElementById('song-tabs');
            songContainer.innerHTML = '';
            getAllSongs().forEach(song => {
                songContainer.appendChild(
                    makeTabButton(song, activeMode

<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- 認証モーダル -->
    <div id="auth-modal" class="fixed inset-0 bg-slate-900/65 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-8 text-center">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full mb-4 text-sm font-bold text-white shadow-sm" style="background-color: #23651C;">
                認証
            </div>
            <h2 class="text-xl font-bold text-slate-900 mb-2">ログイン</h2>

            <!-- 読み込み中表示 -->
            <div id="loading-box" style="display:none;" class="py-6">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-slate-200 mb-3" style="border-top-color:#23651C;"></div>
                <p class="text-sm text-slate-500">データを読み込み中です…（数秒かかることがあります）</p>
            </div>

            <div id="login-box">
                <p class="text-sm text-slate-500 mb-6">IDとパスワードを入力してください。</p>
                <!-- onsubmit="return false" : JSが壊れていてもページがリロードされない保険。実処理は下の addEventListener -->
                <form id="login-form" onsubmit="return false;" class="space-y-4">
                    <input type="text" id="id-input" placeholder="ID" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false"
                        class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 text-center text-base" style="--tw-ring-color: #23651C;" required>
                    <input type="password" id="password-input" placeholder="パスワード" autocomplete="current-password"
                        class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 text-center text-base tracking-widest" style="--tw-ring-color: #23651C;" required>
                    <button type="submit" id="login-btn"
                        class="w-full text-white font-medium py-3 rounded-xl transition shadow-sm cursor-pointer hover:opacity-90" style="background-color: #23651C;">
                        ログイン
                    </button>
                </form>
                <p id="error-msg" class="text-xs text-rose-500 mt-3" style="display:none;"></p>
            </div>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <div id="main-content" class="flex-1 flex-col" style="display:none;">
        <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
            <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
                <div class="leading-tight">
                    <h1 class="text-lg font-bold" style="color: #23651C;">HUWO2027 合奏計画</h1>
                    <p id="user-label" class="text-xs text-slate-500"></p>
                </div>
                <div class="flex items-center space-x-3">
                    <button id="refresh-btn" type="button" class="text-xs font-bold px-3 py-1.5 rounded-lg border border-slate-300 text-slate-700 bg-white hover:bg-slate-100 cursor-pointer disabled:opacity-50 disabled:cursor-default">↻ 更新</button>
                    <button id="logout-btn" class="text-xs text-slate-500 hover:text-slate-800 underline cursor-pointer">ログアウト</button>
                </div>
            </div>
        </header>

        <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full space-y-6">
            <div class="space-y-4 bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-xs">
                <div>
                    <span class="text-sm font-bold text-slate-500 block mb-1.5">演奏会</span>
                    <div id="concert-tabs" class="flex overflow-x-auto space-x-2 pb-1"></div>
                </div>
                <div>
                    <span class="text-sm font-bold text-slate-500 block mb-1.5">練習日</span>
                    <div id="date-tabs" class="flex overflow-x-auto space-x-2 pb-1"></div>
                </div>
                <div>
                    <span class="text-sm font-bold text-slate-500 block mb-1.5">曲名</span>
                    <div id="song-tabs" class="flex overflow-x-auto space-x-2 pb-1"></div>
                </div>
            </div>

            <div id="current-view-title" class="text-lg font-bold text-slate-800 border-b border-slate-200 pb-2"></div>

            <div id="plan-container" class="space-y-4"></div>
        </main>

        <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-400">
            <p>&copy; HUWO2027</p>
        </footer>
    </div>

    <!-- 更新結果などの一時的なお知らせ -->
    <div id="toast" role="status" aria-live="polite" style="display:none;" class="fixed left-1/2 bottom-6 -translate-x-1/2 px-4 py-2 rounded-full text-sm font-bold text-white shadow-lg z-40 pointer-events-none"></div>

    <script>
    (function () {
        'use strict';

        /* ================= 設定 ================= */
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwfUnKlpEQprdTcJXUQfzYftaVPAdQZ0dx9AwXYLSt_Y1e64EKQFUfS9OUgGlicH57w/exec";
        const SESSION_KEY = 'auth_token_v5';   // GASが発行した期限付きトークンを保存
        const CACHE_KEY = 'plans_cache_v5';    // 直近の計画データ（再訪問時に即表示するため）
        const FETCH_TIMEOUT_MS = 25000;
        const DEFAULT_CONCERT = '通常練習';
        const GREEN = '#23651C';
        const NAVY = '#1E3A8A';

        /* ================= 状態 ================= */
        let allPlans = [];           // 「ひながた」を除いた有効シート
        let selectedConcert = '';
        let activeMode = 'date';     // 'date' | 'song'
        let selectedTarget = '';
        let appEntered = false;
        let currentToken = '';       // ログイン中のトークン（保存に失敗してもこの画面では使える）
        let refreshing = false;
        let userName = '';                                    // ログイン中の人の名前
        let userInstrument = '';                              // ログイン中の人の担当楽器（IDPASSシートのD列）
        let attOptions = ['出席', '欠席', '遅刻', '早退'];     // 出欠の選択肢（GASから届いたものに置き換わる）
        const attPending = new Set();                         // 保存中の出欠（二重送信を防ぐ）
        const ATT_COLORS = { '出席': GREEN, '欠席': '#e11d48', '遅刻': '#d97706', '早退': '#2563eb' };

        /* ================= ユーティリティ ================= */
        const $ = (id) => document.getElementById(id);

        // ログイン状態は端末に残す（localStorage）。使えない環境では、そのタブの間だけ有効（sessionStorage）
        const store = {
            get(k) {
                try { const v = localStorage.getItem(k); if (v !== null) return v; } catch (e) { /* 次へ */ }
                try { return sessionStorage.getItem(k); } catch (e) { return null; }
            },
            set(k, v) {
                try { localStorage.setItem(k, v); try { sessionStorage.removeItem(k); } catch (e2) {} return; } catch (e) { /* 次へ */ }
                try { sessionStorage.setItem(k, v); } catch (e) { /* 無視 */ }
            },
            remove(k) {
                try { localStorage.removeItem(k); } catch (e) { /* 無視 */ }
                try { sessionStorage.removeItem(k); } catch (e) { /* 無視 */ }
            }
        };

        function escapeHtml(val) {
            return String(val == null ? '' : val)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function show(id, display) { $(id).style.display = display || 'block'; }
        function hide(id) { $(id).style.display = 'none'; }
        function showError(msg) { const el = $('error-msg'); el.textContent = msg; el.style.display = 'block'; }
        function clearError() { hide('error-msg'); }

        function setLoginButtonBusy(busy) {
            const btn = $('login-btn');
            btn.disabled = busy;
            btn.textContent = busy ? '確認中…' : 'ログイン';
        }

        /* ================= 時刻の整形 ================= */
        function formatTime(val) {
            if (!val) return '';
            const str = String(val).trim();
            if (str.indexOf('T') !== -1) {
                const timePart = (str.split('T')[1] || '').split('.')[0];
                const sub = timePart.split(':');
                if (sub.length >= 2) return sub[0] + ':' + sub[1];
            }
            const m = str.match(/(\d{1,2}):(\d{2})/);
            if (m) return m[1] + ':' + m[2];
            return str;
        }

        function toMinutes(val) {
            // "09:00" でも ISO形式 "1899-12-30T09:00:00.000Z" でも最初の HH:MM を拾う
            const m = String(val == null ? '' : val).match(/(\d{1,2}):(\d{2})/);
            return m ? parseInt(m[1], 10) * 60 + parseInt(m[2], 10) : null;
        }

        function calcDuration(startVal, endVal) {
            const s = toMinutes(startVal);
            const e = toMinutes(endVal);
            if (s === null || e === null) return '';
            let diff = e - s;
            if (diff < 0) diff += 24 * 60;
            return diff > 0 ? String(diff) : '';
        }

        /* ================= GAS との通信 ================= */
        // ID/パスワードの照合はすべてGAS側で行う。ブラウザには認証情報を一切渡さない。
        // Content-Type を text/plain にするのは、GASがCORSのプリフライト(OPTIONS)に対応していないため。
        async function callApi(payload) {
            const ctrl = new AbortController();
            const timer = setTimeout(function () { ctrl.abort(); }, FETCH_TIMEOUT_MS);
            try {
                const res = await fetch(GAS_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload),
                    signal: ctrl.signal
                });
                if (!res.ok) throw new Error('HTTP_' + res.status);
                const data = await res.json();
                if (!data || typeof data.ok !== 'boolean') throw new Error('INVALID_STRUCTURE');
                return data;
            } catch (e) {
                if (e && e.name === 'AbortError') throw new Error('TIMEOUT');
                throw e;
            } finally {
                clearTimeout(timer);
            }
        }

        function describeError(e) {
            const msg = (e && e.message) || '';
            if (msg === 'INVALID_STRUCTURE') return 'サーバーの応答形式が不正です（GAS側の設定・再デプロイをご確認ください）';
            if (msg === 'TIMEOUT') return '応答に時間がかかっています。時間をおいて再度お試しください';
            if (msg.indexOf('HTTP_') === 0) return 'サーバーエラーが発生しました（' + msg.replace('HTTP_', '') + '）';
            return '通信エラーが発生しました。時間をおいて再度お試しください';
        }

        function describeApiError(code) {
            switch (code) {
                case 'BAD_CREDENTIALS': return 'IDまたはパスワードが正しくありません';
                case 'NOT_CONFIGURED': return 'サーバーにIDとパスワードが設定されていません（IDPASSシートをご確認ください）';
                case 'NOT_FOUND': return 'この曲が見つかりませんでした。「↻ 更新」を押してから、もう一度お試しください';
                case 'STALE': return 'シートの内容が更新されています。「↻ 更新」を押してから、もう一度お試しください';
                case 'BUSY': return '混み合っています。もう一度お試しください';
                case 'TOKEN_INVALID': return 'ログインの有効期限が切れました。もう一度ログインしてください';
                default: return 'サーバー側でエラーが発生しました（' + (code || 'UNKNOWN') + '）';
            }
        }

        /* ================= ログイン / ログアウト ================= */
        async function handleLogin(event) {
            event.preventDefault();
            const id = $('id-input').value.trim();
            const pass = $('password-input').value.trim();
            clearError();
            setLoginButtonBusy(true);

            let res;
            try {
                res = await callApi({ action: 'login', id: id, pass: pass });
            } catch (e) {
                console.error('Login failed:', e);
                setLoginButtonBusy(false);
                showError(describeError(e));
                return;
            }
            setLoginButtonBusy(false);

            if (!res.ok) {
                showError(describeApiError(res.error));
                return;
            }
            if (!Array.isArray(res.plans)) {
                showError(describeError(new Error('INVALID_STRUCTURE')));
                return;
            }
            currentToken = res.token || '';
            store.set(SESSION_KEY, currentToken);
            saveCache(res);
            enterApp(res);
        }

        function handleLogout() {
            store.remove(SESSION_KEY);
            store.remove(CACHE_KEY);
            window.location.reload();
        }

        // 端末に残すのは「計画（本人の出欠入り）・名前・選択肢」。次に開いたとき即表示するために使う
        function snapshot(data) {
            return JSON.stringify({ plans: data.plans, name: data.name || '', instrument: data.instrument || '', options: data.options || null });
        }
        function saveCache(data) {
            try { store.set(CACHE_KEY, snapshot(data)); } catch (e) { /* 無視 */ }
        }
        function loadCache() {
            try {
                const raw = store.get(CACHE_KEY);
                const obj = raw ? JSON.parse(raw) : null;
                return obj && Array.isArray(obj.plans) ? obj : null;
            } catch (e) { return null; }
        }

        // 再訪問時：保存済みトークンで自動ログイン。
        // 前回のデータが残っていれば即表示し、最新データは裏で取得して差し替える。
        async function tryAutoLogin() {
            const token = store.get(SESSION_KEY);
            currentToken = token || '';
            if (!token) {
                // ログイン前に GAS を起こしておく（入力中に起動待ちを終わらせる）
                callApi({ action: 'ping' }).catch(function () { /* 無視 */ });
                return;
            }

            const cached = loadCache();
            if (cached) {
                enterApp(cached);
                try {
                    const res = await callApi({ action: 'data', token: token });
                    if (res.ok && Array.isArray(res.plans)) {
                        if (res.token) { currentToken = res.token; store.set(SESSION_KEY, res.token); }   // 有効期限を延長
                        if (snapshot(res) !== snapshot(cached)) {
                            saveCache(res);
                            refreshApp(res);
                        }
                    } else {
                        // トークン期限切れ → ログイン画面からやり直し
                        store.remove(SESSION_KEY);
                        store.remove(CACHE_KEY);
                        window.location.reload();
                    }
                } catch (e) {
                    console.warn('Background refresh failed:', e);   // 古いデータのまま表示を続ける
                }
                return;
            }

            hide('login-box');
            show('loading-box');
            try {
                const res = await callApi({ action: 'data', token: token });
                if (res.ok && Array.isArray(res.plans)) {
                    if (res.token) { currentToken = res.token; store.set(SESSION_KEY, res.token); }   // 有効期限を延長
                    saveCache(res);
                    enterApp(res);
                    return;
                }
                store.remove(SESSION_KEY);
                hide('loading-box');
                show('login-box');
                showError(describeApiError(res.error));
            } catch (e) {
                console.warn('Auto-login failed:', e);
                hide('loading-box');
                show('login-box');
                showError(describeError(e));
            }
        }

        /* ================= 画面切り替え ================= */
        function enterApp(data) {
            if (appEntered) return;
            appEntered = true;
            hide('auth-modal');
            show('main-content', 'flex');
            try {
                initApp(data);
            } catch (e) {
                // 描画エラーでログイン画面には戻さない
                console.error('Render error:', e);
                $('plan-container').innerHTML =
                    '<p class="text-sm text-rose-500 text-center py-8">表示中にエラーが発生しました。ページを再読み込みしてください。</p>';
            }
        }

        // 名前と出欠の選択肢をGASの返答から反映する
        function applyMeta(data) {
            if (typeof data.name === 'string') userName = data.name;
            if (typeof data.instrument === 'string') userInstrument = data.instrument;
            if (Array.isArray(data.options) && data.options.length > 0) attOptions = data.options;
            $('user-label').textContent = userName ? userName + ' さん' + (userInstrument ? '（' + userInstrument + '）' : '') : '';
        }

        // バックグラウンドで取得した最新データに差し替える（今の選択タブはできるだけ維持）
        function refreshApp(data) {
            applyMeta(data);
            const prevConcert = selectedConcert, prevMode = activeMode, prevTarget = selectedTarget;
            allPlans = (data.plans || []).filter(function (p) {
                return p && p.date != null && String(p.date) !== '' && String(p.date).indexOf('ひながた') === -1;
            });
            if (allPlans.length === 0) { initApp(data); return; }
            if (getAllConcerts().indexOf(prevConcert) === -1) { selectConcert(getAllConcerts()[0]); return; }
            selectedConcert = prevConcert;
            if (prevMode === 'song' && getSongsForCurrentConcert().indexOf(prevTarget) !== -1) { selectSongTab(prevTarget); return; }
            const hasDate = getFilteredPlans().some(function (p) { return String(p.date) === prevTarget; });
            if (prevMode === 'date' && hasDate) { selectDateTab(prevTarget); return; }
            selectConcert(prevConcert);
        }

        function initApp(data) {
            applyMeta(data);
            allPlans = (data.plans || []).filter(function (p) {
                return p && p.date != null && String(p.date) !== '' && String(p.date).indexOf('ひながた') === -1;
            });

            if (allPlans.length === 0) {
                $('plan-container').innerHTML =
                    '<p class="text-sm text-slate-400 text-center py-8">有効な練習日シートが見つかりません</p>';
                return;
            }
            selectConcert(getAllConcerts()[0]);
        }

        /* ================= データ加工 ================= */
        function concertOf(plan) { return plan.concertName ? String(plan.concertName) : DEFAULT_CONCERT; }

        function getAllConcerts() {
            const set = new Set();
            allPlans.forEach(function (p) { set.add(concertOf(p)); });
            return Array.from(set);
        }

        function getFilteredPlans() {
            return allPlans.filter(function (p) { return concertOf(p) === selectedConcert; });
        }

        // シートの1行 → 共通オブジェクト（開始時刻か曲名が空なら null）
        function normalizeRow(row) {
            if (!Array.isArray(row)) return null;
            const start = formatTime(row[2]);
            const end = formatTime(row[3]);
            const song = row[1] ? String(row[1]).trim() : '';
            if (start === '' || song === '') return null;
            return {
                slot: row[0] || '',
                song: song,
                start: start,
                end: end,
                minutes: calcDuration(row[2], row[3]),
                goal: row[5] || '',        // ① 一言目標
                focus: row[7] || '',       // ② 取組箇所
                review: row[6] || '',      // ③ 前回の振り返り
                next: row[8] || '',        // ④ 次回に向けて
                note: row[9] || ''         // ⑤ 備考
            };
        }

        const rowsMemo = new WeakMap();
        function rowsOf(plan) {
            let list = rowsMemo.get(plan);
            if (!list) {
                list = [];
                (plan.rows || []).forEach(function (row, idx) {
                    if (idx < 2) return;                       // 1〜2行目は見出し
                    const n = normalizeRow(row);
                    if (n) { n.rowNo = idx + 1; list.push(n); } // rowNo = シート上の行番号（出欠の書き込み先）
                });
                rowsMemo.set(plan, list);
            }
            return list;
        }

        function getSongsForCurrentConcert() {
            const set = new Set();
            getFilteredPlans().forEach(function (plan) {
                rowsOf(plan).forEach(function (r) { set.add(r.song); });
            });
            return Array.from(set);
        }

        /* ================= タブ ================= */
        function makeTabButton(label, isActive, onClick, activeColor) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'px-3.5 py-2 rounded-xl text-sm font-bold whitespace-nowrap transition cursor-pointer shadow-xs';
            if (isActive) {
                btn.className += ' text-white';
                btn.style.backgroundColor = activeColor || GREEN;
            } else {
                btn.className += ' bg-white text-slate-700 hover:bg-slate-100 border border-slate-200';
            }
            btn.textContent = label;
            btn.addEventListener('click', onClick);
            return btn;
        }

        function renderTabs() {
            const concertBox = $('concert-tabs');
            concertBox.innerHTML = '';
            getAllConcerts().forEach(function (name) {
                concertBox.appendChild(makeTabButton(name, name === selectedConcert, function () { selectConcert(name); }, NAVY));
            });

            const dateBox = $('date-tabs');
            dateBox.innerHTML = '';
            getFilteredPlans().forEach(function (plan) {
                const d = String(plan.date);
                dateBox.appendChild(makeTabButton(d, activeMode === 'date' && selectedTarget === d, function () { selectDateTab(d); }));
            });

            const songBox = $('song-tabs');
            songBox.innerHTML = '';
            getSongsForCurrentConcert().forEach(function (song) {
                songBox.appendChild(makeTabButton(song, activeMode === 'song' && selectedTarget === song, function () { selectSongTab(song); }));
            });
        }

        function selectConcert(name) {
            selectedConcert = name;
            const plans = getFilteredPlans();
            if (plans.length > 0) {
                selectDateTab(String(plans[0].date));
            } else {
                activeMode = 'date';
                selectedTarget = '';
                renderTabs();
                $('current-view-title').textContent = name;
                renderCards([], 'date');
            }
        }

        function selectDateTab(date) {
            activeMode = 'date';
            selectedTarget = date;
            renderTabs();
            $('current-view-title').textContent = date + ' の合奏計画';

            const plan = getFilteredPlans().find(function (p) { return String(p.date) === date; });
            const list = plan
                ? rowsOf(plan)
                    .map(function (r) { return Object.assign({ date: date }, r); })
                    .sort(function (a, b) { return a.start.localeCompare(b.start); })
                : [];
            renderCards(list, 'date');
        }

        function selectSongTab(song) {
            activeMode = 'song';
            selectedTarget = song;
            renderTabs();
            $('current-view-title').textContent = '「' + song + '」の練習予定';

            const list = [];
            getFilteredPlans().forEach(function (plan) {
                rowsOf(plan).forEach(function (r) {
                    if (r.song === song) list.push(Object.assign({ date: String(plan.date) }, r));
                });
            });
            renderCards(list, 'song');
        }

        /* ================= カード描画 ================= */
        function detailBlock(label, value, emptyText) {
            return '' +
                '<div class="bg-slate-50 p-4 rounded-xl">' +
                    '<span class="block text-xs font-bold text-slate-400 mb-1">' + label + '</span>' +
                    '<p class="text-base text-slate-800 whitespace-pre-wrap">' + (value ? escapeHtml(value) : emptyText) + '</p>' +
                '</div>';
        }

        /* ================= 出欠 ================= */
        function planByDate(date) {
            return allPlans.find(function (p) { return String(p.date) === date; });
        }
        function currentAttendance(date, row) {
            const plan = planByDate(date);
            return (plan && plan.attendance && plan.attendance[row]) || '';
        }

        // 出欠ボタン一式（選択中のボタンは色が付く。もう一度押すと取り消し）
        function attendanceBlockHtml(date, row, song, start) {
            const current = currentAttendance(date, row);
            const pending = attPending.has(date + '|' + row);
            const options = attOptions.slice();
            if (current && options.indexOf(current) === -1) options.push(current);   // シートに直接書かれた別の値も表示する

            // song / start は、書き込み先の行が今も同じ曲か、GASが確認するために送る
            const attrs = ' data-date="' + escapeHtml(date) + '" data-row="' + escapeHtml(row) + '"' +
                ' data-song="' + escapeHtml(song) + '" data-start="' + escapeHtml(start) + '"';
            const buttons = options.map(function (label) {
                const on = label === current;
                const color = ATT_COLORS[label] || '#64748b';
                return '<button type="button" data-att' + attrs + ' data-val="' + escapeHtml(label) + '"' + (pending ? ' disabled' : '') +
                    ' class="px-3 py-1.5 rounded-lg text-sm font-bold border transition cursor-pointer disabled:opacity-60 disabled:cursor-default' +
                    (on ? ' text-white' : ' bg-white text-slate-700 border-slate-300 hover:bg-slate-100') + '"' +
                    (on ? ' style="background-color:' + color + ';border-color:' + color + ';"' : '') + '>' + escapeHtml(label) + '</button>';
            }).join('');

            return '<div class="mb-4" data-att-block' + attrs + '>' +
                '<span class="block text-xs font-bold text-slate-400 mb-1.5">出欠' + (current ? '' : '（未回答）') + '</span>' +
                '<div class="flex flex-wrap items-center gap-2">' + buttons +
                (pending ? '<span class="text-xs text-slate-400">保存中…</span>' : '') + '</div></div>';
        }

        function rerenderAttendance(date, row) {
            const blocks = $('plan-container').querySelectorAll('[data-att-block]');
            for (let i = 0; i < blocks.length; i++) {
                if (blocks[i].getAttribute('data-date') === date && blocks[i].getAttribute('data-row') === row) {
                    blocks[i].outerHTML = attendanceBlockHtml(date, row, blocks[i].getAttribute('data-song'), blocks[i].getAttribute('data-start'));
                    return;
                }
            }
        }

        function setLocalAttendance(plan, row, status) {
            plan.attendance = plan.attendance || {};
            if (status) plan.attendance[row] = status; else delete plan.attendance[row];
        }

        function handleSessionExpired() {
            store.remove(SESSION_KEY);
            store.remove(CACHE_KEY);
            showToast('ログインの有効期限が切れました。再ログインしてください', true);
            setTimeout(function () { window.location.reload(); }, 1500);
        }

        async function handleAttendanceClick(btn) {
            const date = btn.getAttribute('data-date');
            const row = btn.getAttribute('data-row');
            const val = btn.getAttribute('data-val');
            const song = btn.getAttribute('data-song');
            const start = btn.getAttribute('data-start');
            const key = date + '|' + row;
            const plan = planByDate(date);
            if (!plan || attPending.has(key)) return;
            if (!currentToken) { showToast('ログインし直してください', true); return; }

            const prev = (plan.attendance && plan.attendance[row]) || '';
            const next = prev === val ? '' : val;          // 選択中のボタンをもう一度押すと取り消し

            // 先に画面へ反映し、保存に失敗したら元に戻す
            setLocalAttendance(plan, row, next);
            attPending.add(key);
            rerenderAttendance(date, row);

            try {
                const res = await callApi({ action: 'setAttendance', token: currentToken, date: date, row: Number(row), song: song, start: start, status: next });
                if (!res.ok) {
                    if (res.error === 'TOKEN_INVALID') { handleSessionExpired(); return; }
                    const err = new Error('API'); err.code = res.error; throw err;
                }
                saveCache({ plans: allPlans, name: userName, instrument: userInstrument, options: attOptions });
                showToast(next ? '「' + next + '」で登録しました' : '出欠の登録を取り消しました', false);
            } catch (e) {
                setLocalAttendance(plan, row, prev);
                showToast('出欠を保存できませんでした。' + (e && e.code ? describeApiError(e.code) : describeError(e)), true);
            } finally {
                attPending.delete(key);
                rerenderAttendance(date, row);
            }
        }

        function renderCards(list, mode) {
            const container = $('plan-container');
            container.innerHTML = '';

            if (list.length === 0) {
                container.innerHTML = '<p class="text-sm text-slate-400 text-center py-8">予定はありません</p>';
                return;
            }

            const html = list.map(function (item, index) {
                const cardId = 'card-' + index;
                const dateLabel = mode === 'song'
                    ? '<span class="text-xs px-2 py-0.5 rounded-md font-medium text-white" style="background-color:' + GREEN + ';">' + escapeHtml(item.date) + '</span>'
                    : '';
                // 時間（大きく・曲名の上）。「(90分)」は小さめに添える
                const timeRange = escapeHtml(item.start) + (item.end ? ' 〜 ' + escapeHtml(item.end) : '');
                const minutesText = item.minutes
                    ? '<span class="ml-2 text-base font-medium text-slate-500">(' + escapeHtml(item.minutes) + '分)</span>'
                    : '';

                const sMin = toMinutes(item.start);
                const eMin = toMinutes(item.end);

                return '' +
                '<div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex"' +
                    ' data-date="' + escapeHtml(item.date) + '"' +
                    ' data-s="' + (sMin === null ? '' : sMin) + '" data-e="' + (eMin === null ? '' : eMin) + '">' +
                    '<div class="w-3 flex-shrink-0" style="background-color:' + GREEN + ';"></div>' +
                    '<div class="flex-1 p-5 sm:p-6">' +
                        '<div class="flex items-center space-x-2 mb-2">' +
                            '<span class="px-3 py-1 bg-slate-100 text-slate-700 text-xs font-bold rounded-lg">' + escapeHtml(item.slot) + '</span>' +
                            dateLabel +
                        '</div>' +
                        '<div class="text-2xl font-bold text-slate-900 leading-tight">' + timeRange + minutesText + '</div>' +
                        '<h3 class="text-lg font-bold text-slate-700 mt-1 mb-3">' + escapeHtml(item.song) + '</h3>' +
                        (item.rowNo ? attendanceBlockHtml(String(item.date), String(item.rowNo), item.song, item.start) : '') +
                        '<button type="button" data-toggle="' + cardId + '" class="text-sm font-bold flex items-center space-x-1 cursor-pointer transition hover:opacity-80" style="color:' + GREEN + ';">' +
                            '<span id="' + cardId + '-icon">▼</span><span>詳細を開く / 閉じる</span>' +
                        '</button>' +
                        '<div id="' + cardId + '-content" style="display:none;" class="mt-4 pt-4 border-t border-slate-100 space-y-3">' +
                            detailBlock('① 一言目標', item.goal, '（なし）') +
                            detailBlock('② 取組箇所', item.focus, '（なし）') +
                            detailBlock('③ 前回の振り返り', item.review, '（なし）') +
                            detailBlock('④ 次回に向けて', item.next, '（なし）') +
                            detailBlock('⑤ 備考', item.note, '（なし）') +
                        '</div>' +
                    '</div>' +
                '</div>';
            }).join('');

            container.innerHTML = html;
            updateNowHighlight();
        }

        // アコーディオンは親要素でまとめて処理（イベント委譲）
        function handlePlanContainerClick(e) {
            const att = e.target.closest('[data-att]');
            if (att) { handleAttendanceClick(att); return; }
            const btn = e.target.closest('[data-toggle]');
            if (!btn) return;
            const id = btn.getAttribute('data-toggle');
            const content = $(id + '-content');
            const icon = $(id + '-icon');
            if (!content || !icon) return;
            const closed = content.style.display === 'none';
            content.style.display = closed ? 'block' : 'none';
            icon.textContent = closed ? '▲' : '▼';
        }

        /* ================= 「いま」の練習をハイライト ================= */
        const NOW_COLOR = '#ffff80';
        const jstFormatter = new Intl.DateTimeFormat('en-GB', {
            timeZone: 'Asia/Tokyo', year: 'numeric', month: 'numeric', day: 'numeric',
            hour: 'numeric', minute: 'numeric', hourCycle: 'h23'
        });

        // 現在の日本時間。動作確認用に ?now=2027-01-23T14:10 で時刻を指定できる
        function getNow() {
            const m = /^(\d{4})-(\d{1,2})-(\d{1,2})[T ](\d{1,2}):(\d{2})$/.exec(new URLSearchParams(location.search).get('now') || '');
            if (m) return { y: Number(m[1]), mo: Number(m[2]), d: Number(m[3]), min: Number(m[4]) * 60 + Number(m[5]) };
            const o = {};
            jstFormatter.formatToParts(new Date()).forEach(function (p) { o[p.type] = p.value; });
            return { y: Number(o.year), mo: Number(o.month), d: Number(o.day), min: (Number(o.hour) % 24) * 60 + Number(o.minute) };
        }

        // シート名（"1/23" "1月23日" "2027/1/23" "1/23(金)" など）から月日を取り出す
        const sheetDateCache = new Map();
        function parseSheetDate(rawName) {
            if (sheetDateCache.has(rawName)) return sheetDateCache.get(rawName);
            const name = String(rawName).normalize('NFKC');
            let r = null, m;
            if ((m = /(\d{4})\s*[\/.\-年]\s*(\d{1,2})\s*[\/.\-月]\s*(\d{1,2})/.exec(name))) {
                r = { y: Number(m[1]), mo: Number(m[2]), d: Number(m[3]) };
            } else if ((m = /(\d{1,2})\s*[\/.\-月]\s*(\d{1,2})/.exec(name))) {
                r = { y: null, mo: Number(m[1]), d: Number(m[2]) };
            }
            sheetDateCache.set(rawName, r);
            return r;
        }

        // 今日の日付で、開始 <= 現在 < 終了 のカードを薄黄色にする（画面の再描画はしない）
        function updateNowHighlight() {
            const now = getNow();
            document.querySelectorAll('#plan-container > div[data-s]').forEach(function (card) {
                const sd = parseSheetDate(card.getAttribute('data-date') || '');
                const s = card.getAttribute('data-s');
                const e = card.getAttribute('data-e');
                let on = false;
                if (sd && s !== '' && e !== '' && sd.mo === now.mo && sd.d === now.d && (sd.y === null || sd.y === now.y)) {
                    on = Number(s) <= now.min && now.min < Number(e);
                }
                card.style.backgroundColor = on ? NOW_COLOR : '';
            });
        }

        /* ================= 更新ボタン / お知らせ ================= */
        let toastTimer = null;
        function showToast(message, isError) {
            const el = $('toast');
            el.textContent = message;
            el.style.backgroundColor = isError ? '#e11d48' : GREEN;
            el.style.display = 'block';
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function () { el.style.display = 'none'; }, 2500);
        }

        // 最新のシートの内容を取得して、今の表示（選んでいるタブ）を保ったまま差し替える
        async function handleRefresh() {
            if (refreshing) return;
            if (!currentToken) { showToast('ログインし直してください', true); return; }
            refreshing = true;
            const btn = $('refresh-btn');
            btn.disabled = true;
            btn.textContent = '更新中…';
            try {
                const res = await callApi({ action: 'data', token: currentToken, force: true });
                if (res.ok && Array.isArray(res.plans)) {
                    if (res.token) { currentToken = res.token; store.set(SESSION_KEY, res.token); }
                    saveCache(res);
                    refreshApp(res);
                    showToast('最新の内容に更新しました', false);
                } else if (res.error === 'TOKEN_INVALID') {
                    handleSessionExpired();
                } else {
                    showToast('更新に失敗しました', true);
                }
            } catch (e) {
                console.warn('Refresh failed:', e);
                showToast(describeError(e), true);
            } finally {
                refreshing = false;
                btn.disabled = false;
                btn.textContent = '↻ 更新';
            }
        }

        /* ================= 起動 ================= */
        function boot() {
            $('login-form').addEventListener('submit', handleLogin);
            $('logout-btn').addEventListener('click', handleLogout);
            $('refresh-btn').addEventListener('click', handleRefresh);
            $('plan-container').addEventListener('click', handlePlanContainerClick);
            setInterval(updateNowHighlight, 20000);                       // 20秒ごとに色を更新
            document.addEventListener('visibilitychange', function () {   // 画面に戻ったときにも更新
                if (!document.hidden) updateNowHighlight();
            });
            tryAutoLogin();
        }

        boot();   // このスクリプトは body の末尾にあり、要素はすべて読み込み済み
    })();
    </script>
</body>

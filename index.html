<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUWO2027 合奏計画</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- 認証モーダル -->
    <div id="auth-modal" class="fixed inset-0 bg-slate-900/65 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-8 text-center">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full mb-4 text-sm font-bold text-white shadow-sm" style="background-color: #23651C;">
                認証
            </div>
            <h2 class="text-xl font-bold text-slate-900 mb-2">ログイン</h2>

            <!-- 読み込み中表示（自動ログイン時） -->
            <div id="loading-box" style="display:none;" class="py-6">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-slate-200 border-t-[#23651C] mb-3"></div>
                <p class="text-sm text-slate-500">データを読み込み中です…</p>
            </div>

            <div id="login-box">
                <p class="text-sm text-slate-500 mb-6">IDとパスワードを入力してください。</p>
                <form onsubmit="handleLogin(event)" class="space-y-4">
                    <input type="text" id="id-input" placeholder="ID" autocomplete="username"
                        class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 text-center text-base" style="--tw-ring-color: #23651C;" required>
                    <input type="password" id="password-input" placeholder="パスワード" autocomplete="current-password"
                        class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 text-center text-base tracking-widest" style="--tw-ring-color: #23651C;" required>
                    <button type="submit" id="login-btn"
                        class="w-full text-white font-medium py-3 rounded-xl transition shadow-sm cursor-pointer hover:opacity-90" style="background-color: #23651C;">
                        ログイン
                    </button>
                </form>
                <p id="error-msg" class="text-xs text-rose-500 mt-3" style="display:none;"></p>
            </div>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <div id="main-content" class="flex-1 flex-col" style="display:none;">
        <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
            <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
                <h1 class="text-lg font-bold" style="color: #23651C;">HUWO2027 合奏計画</h1>
                <button onclick="handleLogout()" class="text-xs text-slate-500 hover:text-slate-800 underline cursor-pointer">ログアウト</button>
            </div>
        </header>

        <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full space-y-6">
            <!-- 階層タブ選択エリア -->
            <div class="space-y-4 bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-xs">
                <div>
                    <span class="text-xs font-bold text-slate-400 block mb-1.5">演奏会</span>
                    <div id="concert-tabs" class="flex overflow-x-auto space-x-2 pb-1"></div>
                </div>
                <div>
                    <span class="text-xs font-bold text-slate-400 block mb-1.5">練習日</span>
                    <div id="date-tabs" class="flex overflow-x-auto space-x-2 pb-1"></div>
                </div>
                <div>
                    <span class="text-xs font-bold text-slate-400 block mb-1.5">曲名</span>
                    <div id="song-tabs" class="flex overflow-x-auto space-x-2 pb-1"></div>
                </div>
            </div>

            <div id="current-view-title" class="text-lg font-bold text-slate-800 border-b border-slate-200 pb-2"></div>

            <div id="plan-container" class="space-y-4"></div>
        </main>

        <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-400">
            <p>&copy; HUWO2027</p>
        </footer>
    </div>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzssFjqZj9Onkzn43hbHwCEg2Et8O3f32Tsw-dXzDFms4na4_QX2lrZolGJoXyI3tVG/exec";
        const SESSION_KEY = 'auth_passed_v2';
        const FETCH_TIMEOUT_MS = 25000;

        let plans = [];
        let selectedConcert = '';
        let activeMode = 'date';
        let selectedTarget = '';

        const store = {
            get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
            set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} },
            remove(k) { try { sessionStorage.removeItem(k); } catch (e) {} }
        };

        function escapeHtml(val) {
            return String(val ?? '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function show(id, display = 'block') { document.getElementById(id).style.display = display; }
        function hide(id) { document.getElementById(id).style.display = 'none'; }

        function showError(msg) {
            const el = document.getElementById('error-msg');
            el.innerText = msg;
            el.style.display = 'block';
        }
        function clearError() { hide('error-msg'); }

        function formatTime(val) {
            if (!val) return "";
            const str = String(val).trim();
            if (str.includes("T")) {
                const parts = str.split("T");
                if (parts.length > 1) {
                    const timePart = parts[1].split(".")[0];
                    const timeSub = timePart.split(":");
                    if (timeSub.length >= 2) return `${timeSub[0]}:${timeSub[1]}`;
                }
            }
            const match = str.match(/(\d{1,2}):(\d{2})/);
            if (match) return `${match[1]}:${match[2]}`;
            return str;
        }

        function formatMinutes(startTimeStr, endTimeStr) {
            if (!startTimeStr || !endTimeStr) return "";
            try {
                const parseToMin = (s) => {
                    const clean = String(s).trim();
                    if (clean.includes("T")) {
                        const tPart = clean.split("T")[1];
                        const tSub = tPart.split(":");
                        if (tSub.length >= 2) return parseInt(tSub[0], 10) * 60 + parseInt(tSub[1], 10);
                    }
                    const m = clean.match(/(\d{1,2}):(\d{2})/);
                    if (m) return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
                    return null;
                };

                const startMin = parseToMin(startTimeStr);
                const endMin = parseToMin(endTimeStr);

                if (startMin !== null && endMin !== null) {
                    let diff = endMin - startMin;
                    if (diff < 0) diff += 24 * 60;
                    return diff > 0 ? `${diff}` : "";
                }
            } catch (e) {
                console.error("Minute calculation warning:", e);
            }
            return "";
        }

        async function fetchServerData() {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS);
            try {
                const res = await fetch(GAS_API_URL, { signal: ctrl.signal });
                if (!res.ok) throw new Error(`HTTP_${res.status}`);
                const data = await res.json();
                if (!data || !data.auth || !Array.isArray(data.plans)) {
                    throw new Error('INVALID_STRUCTURE');
                }
                return data;
            } finally {
                clearTimeout(timer);
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            const inputId = document.getElementById('id-input').value.trim();
            const inputPass = document.getElementById('password-input').value.trim();
            const btn = document.getElementById('login-btn');
            clearError();
            btn.disabled = true;
            btn.innerText = '確認中…';

            try {
                const data = await fetchServerData();
                btn.disabled = false;
                btn.innerText = 'ログイン';

                if (inputId === String(data.auth.id).trim() && inputPass === String(data.auth.pass).trim()) {
                    store.set(SESSION_KEY, 'true');
                    enterApp(data);
                } else {
                    showError('IDまたはパスワードが正しくありません');
                }
            } catch (e) {
                console.error(e);
                btn.disabled = false;
                btn.innerText = 'ログイン';
                showError('通信エラーが発生しました。時間をおいて再度お試しください');
            }
        }

        function handleLogout() {
            store.remove(SESSION_KEY);
            window.location.reload();
        }

        window.addEventListener('DOMContentLoaded', async () => {
            if (store.get(SESSION_KEY) !== 'true') return;

            hide('login-box');
            show('loading-box');
            
            try {
                const data = await fetchServerData();
                enterApp(data);
            } catch (e) {
                console.warn('Auto-login failed, fallback to login screen:', e);
                store.remove(SESSION_KEY);
                hide('loading-box');
                show('login-box');
            }
        });

        function enterApp(data) {
            hide('auth-modal');
            show('main-content', 'flex');
            try {
                initApp(data);
            } catch (e) {
                console.error('Render error:', e);
                document.getElementById('plan-container').innerHTML =
                    `<p class="text-sm text-rose-500 text-center py-8">表示中にエラーが発生しました。再読み込みしてください。</p>`;
            }
        }

        function initApp(data) {
            plans = (data.plans || []).filter(p => p && p.date && !String(p.date).includes("ひながた"));

            if (plans.length === 0) {
                document.getElementById('plan-container').innerHTML =
                    `<p class="text-sm text-slate-400 text-center py-8">有効な練習日シートが見つかりません</p>`;
                return;
            }

            const concerts = getAllConcerts();
            if (concerts.length > 0) {
                selectedConcert = concerts[0];
            }
            selectConcert(selectedConcert);
        }

        function getAllConcerts() {
            const concerts = new Set();
            plans.forEach(p => {
                const cName = p.concertName || "通常練習";
                concerts.add(cName);
            });
            return Array.from(concerts);
        }

        function getFilteredPlans() {
            return plans.filter(p => (p.concertName || "通常練習") === selectedConcert);
        }

        function normalizeRow(row) {
            if (!Array.isArray(row)) return null;
            const 開始 = formatTime(row[2]);
            const 終了 = formatTime(row[3]);
            const 曲名 = row[1] ? String(row[1]).trim() : "";
            
            if (開始 === "" || 曲名 === "") return null;
            
            return {
                枠: row[0] || "",
                曲名,
                開始,
                終了,
                時間: formatMinutes(row[2], row[3]),
                一言目標: row[5] || "",
                取組箇所: row[7] || "",
                振り返り: row[6] || "",
                次回向け: row[8] || "",
                備考: row[9] || ""
            };
        }

        function getAllSongsForCurrentConcert() {
            const songs = new Set();
            getFilteredPlans().forEach(plan => {
                (plan.rows || []).slice(2).forEach(row => {
                    const n = normalizeRow(row);
                    if (n) songs.add(n.曲名);
                });
            });
            return Array.from(songs);
        }

        function makeTabButton(label, isActive, onClick, customColor = '#23651C') {
            const btn = document.createElement('button');
            btn.className = 'px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition cursor-pointer';
            if (isActive) {
                btn.className += ' text-white shadow-sm';
                btn.style.backgroundColor = customColor;
            } else {
                btn.className += ' bg-white text-slate-600 hover:bg-slate-100 border border-slate-200';
            }
            btn.innerText = label;
            btn.onclick = onClick;
            return btn;
        }

        function renderTabs() {
            const concertContainer = document.getElementById('concert-tabs');
            concertContainer.innerHTML = '';
            getAllConcerts().forEach(cName => {
                concertContainer.appendChild(
                    makeTabButton(cName, selectedConcert === cName, () => selectConcert(cName), '#1E3A8A')
                );
            });

            const filteredPlans = getFilteredPlans();
            const dateContainer = document.getElementById('date-tabs');
            dateContainer.innerHTML = '';
            filteredPlans.forEach(item => {
                const d = String(item.date);
                dateContainer.appendChild(
                    makeTabButton(d, activeMode === 'date' && selectedTarget === d, () => selectDateTab(d))
                );
            });

            const songContainer = document.getElementById('song-tabs');
            songContainer.innerHTML = '';
            getAllSongsForCurrentConcert().forEach(song => {
                songContainer.appendChild(
                    makeTabButton(song, activeMode === 'song' && selectedTarget === song, () => selectSongTab(song))
                );
            });
        }

        function selectConcert(concertName) {
            selectedConcert = concertName;
            const filtered = getFilteredPlans();
            if (filtered.length > 0) {
                activeMode = 'date';
                selectedTarget = String(filtered[0].date);
                selectDateTab(selectedTarget);
            } else {
                activeMode = 'date';
                selectedTarget = '';
                renderTabs();
                document.getElementById('current-view-title').innerText = `${concertName} の予定`;
                document.getElementById('plan-container').innerHTML = `<p class="text-sm text-slate-400 text-center py-8">この演奏会の練習予定はありません</p>`;
            }
        }

        function selectDateTab(date) {
            activeMode = 'date';
            selectedTarget = date;
            renderTabs();
            document.getElementById('current-view-title').innerText = `${date} の合奏計画`;

            const filtered = getFilteredPlans();
            const sheet = filtered.find(p => String(p.date) === date);
            const list = ((sheet && sheet.rows) || []).slice(2)
                .map(normalizeRow)
                .filter(Boolean)
                .sort((a, b) => a.開始.localeCompare(b.開始));
            renderCards(list, 'date');
        }

        function selectSongTab(songName) {
            activeMode = 'song';
            selectedTarget = songName;
            renderTabs();
            document.getElementById('current-view-title').innerText = `「${songName}」の練習予定 (${selectedConcert})`;

            const list = [];
            getFilteredPlans().forEach(plan => {
                (plan.rows || []).slice(2).forEach(row => {
                    const n = normalizeRow(row);
                    if (n && n.曲名 === songName) list.push({ ...n, date: String(plan.date) });
                });
            });
            renderCards(list, 'song');
        }

        function detailBlock(label, value, emptyText) {
            return `
                <div class="bg-slate-50 p-4 rounded-xl">
                    <span class="block text-xs font-bold text-slate-400 mb-1">${label}</span>
                    <p class="text-base text-slate-800 whitespace-pre-wrap">${value ? escapeHtml(value) : emptyText}</p>
                </div>`;
        }

        function renderCards(dataList, mode = 'date') {
            const container = document.getElementById('plan-container');
            container.innerHTML = '';

            if (dataList.length === 0) {
                container.innerHTML = `<p class="text-sm text-slate-400 text-center py-8">予定はありません</p>`;
                return;
            }

            dataList.forEach((item, index) => {
                const dateLabel = mode === 'song'
                    ? `<span class="text-xs px-2 py-0.5 rounded-md font-medium text-white" style="background-color: #23651C;">${escapeHtml(item.date)}</span>`
                    : '';
                const cardId = `card-${index}`;

                container.insertAdjacentHTML('beforeend', `
                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex">
                        <div class="w-3 flex-shrink-0" style="background-color: #23651C;"></div>
                        <div class="flex-1 p-5 sm:p-6">
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
                                <div class="flex items-center space-x-2">
                                    <span class="px-3 py-1 bg-slate-100 text-slate-700 text-xs font-bold rounded-lg">${escapeHtml(item.枠)}</span>
                                    ${dateLabel}
                                </div>
                                <h3 class="text-xl font-bold text-slate-900 text-left">${escapeHtml(item.曲名)}</h3>
                            </div>

                            <div class="text-base text-slate-600 mb-4 font-semibold">
                                時間：<span class="text-slate-900">${escapeHtml(item.開始)} 〜 ${escapeHtml(item.終了)} ${item.時間 ? `(${escapeHtml(item.時間)}分)` : ''}</span>
                            </div>

                            <button onclick="toggleAccordion('${cardId}')" class="text-sm font-bold flex items-center space-x-1 cursor-pointer transition hover:opacity-80" style="color: #23651C;">
                                <span id="${cardId}-icon">▼</span>
                                <span>詳細を開く / 閉じる</span>
                            </button>

                            <div id="${cardId}-content" style="display:none;" class="mt-4 pt-4 border-t border-slate-100 space-y-3">
                                ${detailBlock('① 一言目標', item.一言目標, '（なし）')}
                                ${detailBlock('② 取組箇所', item.取組箇所, '（なし）')}
                                ${detailBlock('③ 前回の振り返り', item.振り返り, '（なし）')}
                                ${detailBlock('④ 次回に向けて', item.次回向け, '（なし）')}
                                ${detailBlock('⑤ 備考', item.備考, '（なし）')}
                            </div>
                        </div>
                    </div>
                `);
            });
        }

        function toggleAccordion(cardId) {
            const content = document.getElementById(`${cardId}-content`);
            const icon = document.getElementById(`${cardId}-icon`);
            const isClosed = content.style.display === 'none';
            content.style.display = isClosed ? 'block' : 'none';
            icon.innerText = isClosed ? '▲' : '▼';
        }
    </script>
</body>
</html>
